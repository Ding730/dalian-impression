<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面走丢了 · 大连印记</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
            color: #e6f1ff;
            background:
                radial-gradient(circle at 50% 30%, rgba(30, 144, 255, .22), transparent 62%),
                radial-gradient(circle at 80% 90%, rgba(100, 255, 218, .16), transparent 58%),
                #04101f;
        }
        .card {
            width: min(560px, 100%);
            padding: 40px 34px;
            border-radius: 20px;
            border: 1px solid rgba(100, 168, 255, .2);
            background: linear-gradient(160deg, rgba(16, 42, 76, .72), rgba(6, 20, 40, .78));
            box-shadow: 0 24px 60px rgba(2, 10, 24, .55);
            text-align: center;
        }
        .code {
            font-size: 3.4rem;
            font-weight: 800;
            letter-spacing: .1em;
            background: linear-gradient(90deg, #ffffff, #a9d8ff 45%, #00d2ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        h1 { margin: 10px 0 14px; font-size: 1.25rem; letter-spacing: .1em; }
        p { color: #93a9c9; font-size: .92rem; line-height: 1.8; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 26px; }
        a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 99px;
            border: 1px solid rgba(100, 168, 255, .28);
            background: rgba(255, 255, 255, .05);
            color: #e6f1ff;
            font-size: .92rem;
            text-decoration: none;
            transition: transform .3s, background .3s, border-color .3s;
        }
        a:hover { transform: translateY(-3px); border-color: rgba(100, 255, 218, .5); background: rgba(0, 210, 255, .14); }
        a.primary {
            border-color: transparent;
            color: #04101f;
            font-weight: 700;
            background: linear-gradient(135deg, #1e90ff, #00d2ff);
            box-shadow: 0 14px 30px rgba(30, 144, 255, .35);
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="code">404</div>
        <h1>这片海湾暂时没有内容</h1>
        <p>
            你访问的页面不存在或已被移动。<br>
            不妨回到首页，从 1899 年的青泥洼重新开始这次「数字漫游」。
        </p>
        <div class="actions">
            <a class="primary" href="./index.html">返回首页</a>
            <a href="./index.html#history">历史长廊</a>
            <a href="./index.html#future">未来规划</a>
        </div>
    </main>
</body>
</html>
